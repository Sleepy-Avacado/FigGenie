  <title>shared-stage-crossed-fanout-rejoin</title>
  <desc>a shared processing box fans out via crossing diagonal arrows to two parallel per-replica boxes (each starting a lane, ellipsis showing more lanes), the lanes run down two more shared/private stages and re-converge via crossing arrows into another shared box; green/pink background tint distinguishes shared (static) from per-replica (dynamic) rows | source: asplos25-065_fig7 (src/fig7_chunk-graph.svg) | candidate wave2:shared-stage-crossed-fanout-rejoin | units: pt at print size | colours as drawn, recolour by role</desc>

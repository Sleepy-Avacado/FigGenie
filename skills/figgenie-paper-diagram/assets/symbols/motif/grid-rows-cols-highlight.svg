    <rect x="0" y="11" width="12" height="4" fill="#f2f2f2" stroke="#595959" stroke-width="0.4"/>
    <rect x="16" y="11" width="12" height="4" fill="#dae8fc" stroke="#595959" stroke-width="0.4"/>

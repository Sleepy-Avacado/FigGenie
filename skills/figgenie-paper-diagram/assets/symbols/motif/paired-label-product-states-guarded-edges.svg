  <title>paired-label-product-states-guarded-edges</title>
  <desc>product-construction automaton where each state circle holds two stacked labels (e.g. A over C) denoting a paired state from combining two machines; guarded edges labelled b / epsilon / blank connect them, one state double-circled as accepting with an initial arrow | source: osdi26-136_fig7 (osdi26-136_fig7_p9_vector.svg) | candidate wave4:paired-label-product-states-guarded-edges | units: pt at print size | colours as drawn, recolour by role</desc>
